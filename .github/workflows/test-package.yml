# This workflow tests the dpolcat packaging and demo notebooks

name: Package & Test

on:
    workflow_dispatch:
    pull_request:
      branches: [ "main" ]
    push:
      branches: [ "main" ]

jobs:
  test-pixi:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
            pixi-version: v0.84.2
    - run: pixi run test
  test-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv build --wheel
      - run: uv venv /tmp/venv
      - run: uv pip install --python /tmp/venv "$(ls dist/*.whl)[hv]"
      - run: /tmp/venv/bin/python -c "import dpolcat; print(dpolcat.__file__)"
      - run: /tmp/venv/bin/python demo/test_run_demos.py
