# This workflow tests the dpolcat packaging and demo notebooks

name: Python package

on:
    workflow_dispatch
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

jobs:
  test-conda-package:

    runs-on: ubuntu-latest
    # strategy:
    #   fail-fast: true
    #   matrix:
    #     python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
            pixi-version: v0.84.2

            # cache: true
            # auth-host: prefix.dev
            # auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}
    - run: pixi run test
  test-py-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv build --wheel
      - run: uv venv /tmp/venv
      - run: uv pip install --python /tmp/venv "$(ls dist/*.whl)[hv]"
      - run: /tmp/venv/bin/python -c "import dpolcat; print(dpolcat.__file__)"
      - run: /tmp/venv/bin/python demo/test_run_demos.py
